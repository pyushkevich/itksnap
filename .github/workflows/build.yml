name: Build

on:
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Open an SSH debug session (upterm) before the build'
        required: false
        default: false
      debug_preqt_enabled:
        type: boolean
        description: 'Open an SSH debug session (upterm) before the Qt install'
        required: false
        default: false
      use_cached_itksnap_build:
        type: boolean
        description: 'Use cached ITK-SNAP build'
        required: false
        default: false        
      skip_testing:
        type: boolean
        description: 'Skip testing'
        required: false
        default: false       
      upload_release:
        type: boolean
        description: 'Upload a named release to SourceForge'
        required: false
        default: false
      skip_packaging:
        type: boolean
        description: 'Skip packaging and SourceForge upload'
        required: false
        default: false
  push:
  pull_request:
  # release:
  # types:
  #   - published

env:
  MACOS_DEPLOYMENT_TARGET: '14.0'

# A new push to a branch or pull request cancels the run still going for it. Runs on master
# and manual runs (which may upload a release) are never cancelled: each gets its own group.
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch') && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  build_itksnap:
    name: Build and Package ITK-SNAP on ${{ matrix.platform || matrix.os }}
    runs-on: ${{ matrix.os }}
    # Linux x64 builds in a Rocky Linux 8 container (see the matrix below)
    container: ${{ matrix.container }}
    permissions:
      contents: read
      # Needed to delete older ITK-SNAP build caches
      actions: write
    env:
      # Names the platform in cache keys and on CDash: the runner, or the container's distro
      PLATFORM: ${{ matrix.platform || matrix.os }}
      SKIP_PACKAGING: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/claude/')) || (github.event_name == 'workflow_dispatch' && inputs.skip_packaging == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        # Intel and ARM builds for each platform
        os: [ubuntu-24.04,ubuntu-24.04-arm,macos-15-intel,macos-15,windows-2022,windows-11-arm]
        # ITK before 5.4.6 does not compile for Windows arm64: GDCM's gdcmFilename.cxx includes
        # windows.h inside namespace gdcm, which breaks the inline _Interlocked* functions
        # that the Windows SDK defines on arm64
        itk_ver: [ 'v5.4.7' ]
        vtk_ver: [ '9.5.2' ]
        qt_ver: [ '6.9.3' ]
        include:
          # The x64 Linux build runs in a Rocky Linux 8 container, so that its package needs
          # only glibc 2.28 (RHEL/Rocky 8, Debian 10, Ubuntu 18.10 and newer). Qt's x64 binaries
          # are built on RHEL 8, so they run there too.
          - os: ubuntu-24.04
            platform: rocky8
            container: rockylinux:8
            qt_host: linux
            qt_arch: linux_gcc_64
            ctest_cmd: xvfb-run -a ctest
          # Qt's arm64 Linux binaries require glibc 2.38, so this one can't use an older distro
          - os: ubuntu-24.04-arm
            qt_host: linux_arm64
            qt_arch: linux_gcc_arm64
            ctest_cmd: xvfb-run -a ctest
          - os: macos-15-intel
            qt_host: mac
            qt_arch: clang_64
            ctest_cmd: ctest
          - os: macos-15
            qt_host: mac
            qt_arch: clang_64
            ctest_cmd: ctest
          - os: windows-2022
            qt_host: windows
            qt_arch: win64_msvc2022_64
            msvc_arch: x64
            vcpkg_triplet: x64-windows-release
            ctest_cmd: ctest
          # vcpkg has no release-only triplet for arm64, so it builds debug and release
          - os: windows-11-arm
            qt_host: windows_arm64
            qt_arch: win64_msvc2022_arm64
            msvc_arch: arm64
            vcpkg_triplet: arm64-windows
            ctest_cmd: ctest

    steps:

      # Install the tools and libraries in the Rocky Linux container. The stock gcc 8 is too
      # old for VTK 9.5, so the build uses gcc-toolset-13; its libstdc++ is linked so that the
      # binaries need only the system's libstdc++. Python 3.11 is for aqtinstall (Qt).
      - name: Prepare Rocky Linux container
        if: ${{ matrix.container }}
        shell: bash
        run: |
          dnf -y install dnf-plugins-core epel-release
          dnf config-manager --set-enabled powertools
          dnf config-manager --add-repo https://cli.github.com/packages/rpm/gh-cli.repo
          dnf -y install gcc-toolset-13 git cmake ninja-build python3.11 python3.11-pip \
            libcurl-devel libssh-devel openssl-devel zlib-devel \
            mesa-libGL-devel mesa-libEGL-devel mesa-dri-drivers libX11-devel libXt-devel \
            libXext-devel libxkbcommon-devel libxkbcommon-x11 fontconfig-devel freetype-devel \
            xcb-util-cursor xcb-util-image xcb-util-keysyms xcb-util-renderutil xcb-util-wm \
            dbus-libs glib2 xorg-x11-server-Xvfb xorg-x11-xauth which file findutils \
            jq zstd tar gzip unzip openssh-clients gh
          alternatives --set python3 /usr/bin/python3.11
          # The container runs as root, but the workspace belongs to the runner user
          git config --global --add safe.directory '*'
          echo "/opt/rh/gcc-toolset-13/root/usr/bin" >> $GITHUB_PATH
          echo "CC=/opt/rh/gcc-toolset-13/root/usr/bin/gcc" >> $GITHUB_ENV
          echo "CXX=/opt/rh/gcc-toolset-13/root/usr/bin/g++" >> $GITHUB_ENV
          # github.workspace is the path on the host. Inputs that start with it are mapped into
          # the container, but CMake options like ITK_DIR=... are not, so those use env.WS.
          echo "WS=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          # ssh reads ~/.ssh from the home directory in /etc/passwd (/root), not from $HOME
          # (/github/home), where the SourceForge upload step puts its key and config
          mkdir -p $HOME/.ssh && chmod 700 $HOME/.ssh && ln -sfn $HOME/.ssh /root/.ssh

      # Select MSVC tools on windows
      - name: Select MSVC 2019/2022
        uses: ilammy/msvc-dev-cmd@v1
        if: ${{ runner.os == 'Windows' }}
        with:
          arch: ${{ matrix.msvc_arch }}

      # Setup ninja
      - name: Setup Ninja
        if: ${{ !matrix.container }}
        uses: seanmiddleditch/gha-setup-ninja@master

      # Install system packages
      # On macOS, libssh is built from source instead (see "Build libssh on MacOS" below)
      - name: Install System Packages
        if: ${{ !matrix.container }}
        uses: ConorMacBride/install-package@v1
        with:
          apt: libcurl4-openssl-dev libssh-dev xvfb
          choco: nsis

      # Install curl and libssh on Windows. The action caches the built packages, keyed by the
      # package versions. (v6 cached with pat-s/always-upload-cache@v3, which uses GitHub's
      # retired cache service and failed with "Cache service responded with 400", so every run
      # rebuilt curl, libssh, zlib and OpenSSL: 5 minutes on x64, 11 on arm64.)
      - name: Install libcurl on Windows
        uses: johnwason/vcpkg-action@v8
        id: vcpkg
        if: ${{ runner.os == 'Windows' }}
        with:
          pkgs: curl libssh zlib
          triplet: ${{ matrix.vcpkg_triplet }}
          token: ${{ github.token }}
    
      # The SSH command is printed in the step log. Only the user who started the run can
      # join, with an SSH key from their GitHub profile. To resume the job, exit the shell
      # or run "touch $GITHUB_WORKSPACE/continue".
      - name: Setup upterm session
        uses: owenthereal/action-upterm@v2
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_preqt_enabled }}
        with:
          limit-access-to-actor: true

      # Install Qt
      - name: Install Qt on Ubuntu
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_ver }}
          target: 'desktop'
          host: ${{ matrix.qt_host }}
          arch: ${{ matrix.qt_arch }}
          cache: true
          extra: '--timeout 60'
          # The container installs Python 3.11 and Qt's dependencies itself: actions/setup-python's
          # builds are for Ubuntu, and the action installs the dependencies with apt-get
          setup-python: ${{ !matrix.container }}
          install-deps: ${{ !matrix.container }}

      # Use cached VTK build if available
      - name: Restore VTK Cache
        id: cache-vtk
        uses: actions/cache/restore@v4
        with:
          path: ${{github.workspace}}/vtk/install
          key: ${{ env.PLATFORM }}-vtk-${{ matrix.vtk_ver }}${{ runner.os == 'MacOS' && format('-osx{0}', env.MACOS_DEPLOYMENT_TARGET) || '' }}

      # Check out VTK
      - name: Checkout VTK
        if: steps.cache-vtk.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
            repository: 'Kitware/VTK.git'
            ref: v${{ matrix.vtk_ver }}
            submodules: true
            path: 'vtk'

      # Build VTK
      - name: Build VTK
        if: steps.cache-vtk.outputs.cache-hit != 'true'
        uses: threeal/cmake-action@v2.0.0
        with:
          source-dir: ${{github.workspace}}/vtk
          build-dir: ${{github.workspace}}/vtk/build
          build-args: "-t install -- -k 0"
          generator: Ninja
          options: |
            BUILD_TESTING:BOOL=FALSE
            BUILD_EXAMPLES:BOOL=FALSE
            BUILD_SHARED_LIBS:BOOL=FALSE
            VTK_REQUIRED_OBJCXX_FLAGS:STRING=
            VTK_GROUP_ENABLE_Qt:STRING=YES
            VTK_MODULE_ENABLE_VTK_GUISupportQtQuick:STRING=NO
            VTK_MODULE_ENABLE_VTK_GUISupportQtSQL:STRING=NO
            VTK_MODULE_ENABLE_VTK_RenderingExternal:STRING=WANT
            CMAKE_BUILD_TYPE=Release
            CMAKE_INSTALL_PREFIX=${{ env.WS || github.workspace }}/vtk/install
            ${{ runner.os == 'Windows' && 'VTK_SMP_ENABLE_STDTHREAD=OFF' || '' }}
            ${{ runner.os == 'MacOS' && format('CMAKE_OSX_DEPLOYMENT_TARGET={0}', env.MACOS_DEPLOYMENT_TARGET) || '' }}
     
      # Cache the VTK build
      - name: Cache VTK
        if: steps.cache-vtk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{github.workspace}}/vtk/install
          key: ${{ env.PLATFORM }}-vtk-${{ matrix.vtk_ver }}${{ runner.os == 'MacOS' && format('-osx{0}', env.MACOS_DEPLOYMENT_TARGET) || '' }}

      # Use cached ITK build if available. Unfortunately ITK make install fails to 
      # install one file, vnl_vector_ref.hxx so instead of caching the install dir
      # we are caching the build dir
      - name: Restore ITK Cache
        id: cache-itk
        uses: actions/cache/restore@v4
        with:
          path: ${{github.workspace}}/itk
          key: ${{ env.PLATFORM }}-itk-${{ matrix.itk_ver }}-build${{ runner.os == 'MacOS' && format('-osx{0}', env.MACOS_DEPLOYMENT_TARGET) || '' }}

      # Check out ITK
      - name: Checkout ITK
        if: steps.cache-itk.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
            repository: 'InsightSoftwareConsortium/ITK.git'
            ref: ${{ matrix.itk_ver }}
            submodules: true
            path: 'itk'

      # Build ITK
      - name: Build ITK
        if: steps.cache-itk.outputs.cache-hit != 'true'
        uses: threeal/cmake-action@v2.0.0
        with:
          source-dir: ${{github.workspace}}/itk
          build-dir: ${{github.workspace}}/itk/build
          build-args: |
            -t
            install
          generator: Ninja
          options: |
            BUILD_TESTING:BOOL=FALSE
            BUILD_EXAMPLES:BOOL=FALSE
            Module_MorphologicalContourInterpolation:BOOL=TRUE
            CMAKE_BUILD_TYPE=Release
            CMAKE_INSTALL_PREFIX=${{ env.WS || github.workspace }}/itk/install
            ${{ runner.os == 'Windows' && 'CMAKE_EXE_LINKER_FLAGS=/FORCE:MULTIPLE' || '' }}
            ${{ runner.os == 'Windows' && 'CMAKE_EXE_SHARED_FLAGS=/FORCE:MULTIPLE' || '' }}
            ${{ runner.os == 'MacOS' && format('CMAKE_OSX_DEPLOYMENT_TARGET={0}', env.MACOS_DEPLOYMENT_TARGET) || '' }}

      - name: Cache ITK
        if: steps.cache-itk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{github.workspace}}/itk
          key: ${{ env.PLATFORM }}-itk-${{ matrix.itk_ver }}-build${{ runner.os == 'MacOS' && format('-osx{0}', env.MACOS_DEPLOYMENT_TARGET) || '' }}
     
      # Restore ITK-SNAP cache if requested by the user. This should allow us to create faster builds
      # because only the updated files should require rebuilding. Only master builds are cached
      # (see "Cache ITK-SNAP build directory"), and any branch can restore the latest one.
      - name: Restore ITK-SNAP Cache (optional)
        id: cache-restore-itksnap
        uses: actions/cache/restore@v4
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.use_cached_itksnap_build }}
        with:
          path: ${{github.workspace}}/itksnap
          key: ${{ env.PLATFORM }}-itksnap-build-master-
          restore-keys: ${{ env.PLATFORM }}-itksnap-build-master-

      # Checkout ITK-SNAP code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
            submodules: true
            clean: false
            path: itksnap
            persist-credentials: false

      # Post-checkout fetch. This is to prevent errors from the ExperimentalUpdate command due to 
      # some bizarre git error with greedy submodule. 
      - name: Post-checkout fetch
        working-directory: ${{github.workspace}}/itksnap
        shell: bash
        continue-on-error: true
        run: git fetch

      # On macOS, build libssh and OpenSSL from source rather than installing them with Homebrew.
      # Homebrew's libraries are built for the runner's macOS version (15.0), not for
      # MACOS_DEPLOYMENT_TARGET, and they are bundled into the package, so the package would not
      # run on older macOS versions that it claims to support. Also, Homebrew no longer provides
      # bottles for Intel Macs, so "brew install libssh" built CMake, OpenSSL and libssh from
      # source on every Intel run (about 40 minutes). The script pins the versions and checksums;
      # the result is cached (a few MB) and rebuilt only when the script changes.
      - name: Restore libssh Cache
        id: cache-libssh
        if: ${{ runner.os == 'MacOS' }}
        uses: actions/cache/restore@v4
        with:
          path: ${{github.workspace}}/libssh
          key: ${{ env.PLATFORM }}-libssh-${{ hashFiles('itksnap/Utilities/MacOS/build_libssh.sh') }}-osx${{ env.MACOS_DEPLOYMENT_TARGET }}

      - name: Build libssh on MacOS
        if: ${{ runner.os == 'MacOS' && steps.cache-libssh.outputs.cache-hit != 'true' }}
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ env.MACOS_DEPLOYMENT_TARGET }}
        run: itksnap/Utilities/MacOS/build_libssh.sh ${{github.workspace}}/libssh

      - name: Cache libssh
        if: ${{ runner.os == 'MacOS' && steps.cache-libssh.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{github.workspace}}/libssh
          key: ${{ env.PLATFORM }}-libssh-${{ hashFiles('itksnap/Utilities/MacOS/build_libssh.sh') }}-osx${{ env.MACOS_DEPLOYMENT_TARGET }}

      # Configure ITK-SNAP. On Rocky Linux, VTK installs its libraries in lib64.
      # Note: /FORCE:MULTIPLE is a temporary fix for ITK issues in 5.4.0
      - name: Configure ITK-SNAP
        uses: threeal/cmake-action@v2.0.0
        continue-on-error: false
        with:
          source-dir: ${{github.workspace}}/itksnap
          build-dir: ${{github.workspace}}/itksnap/build
          generator: ${{ runner.os == 'MacOS' && 'Unix Makefiles' || 'Ninja' }}
          run-build: false
          args: ${{ runner.os == 'Windows' && steps.vcpkg.outputs.vcpkg-cmake-config || '' }} 
          options: |
            ITK_DIR=${{ env.WS || github.workspace }}/itk/build
            VTK_DIR=${{ env.WS || github.workspace }}/vtk/install/${{ matrix.container && 'lib64' || 'lib' }}/cmake/vtk-9.5
            CMAKE_BUILD_TYPE=Release
            DO_UPLOAD=ON
            SITE=github-runner-${{ env.PLATFORM }}
            ${{ runner.os == 'Windows' && format('CURL_LIBRARY={0}/vcpkg/installed/{1}/lib/libcurl.lib', github.workspace, matrix.vcpkg_triplet) || '' }}
            ${{ runner.os == 'Windows' && format('CURL_INCLUDE_DIR={0}/vcpkg/installed/{1}/include', github.workspace, matrix.vcpkg_triplet) || '' }}
            ${{ runner.os == 'Windows' && 'CMAKE_EXE_LINKER_FLAGS=/FORCE:MULTIPLE' || '' }}
            ${{ runner.os == 'Windows' && 'CMAKE_EXE_SHARED_FLAGS=/FORCE:MULTIPLE' || '' }}
            ${{ runner.os == 'MacOS' && format('CMAKE_OSX_DEPLOYMENT_TARGET={0}', env.MACOS_DEPLOYMENT_TARGET) || '' }}
            ${{ runner.os == 'MacOS' && format('CMAKE_PREFIX_PATH={0}/libssh', github.workspace) || '' }}

      # The SSH command is printed in the step log. Only the user who started the run can
      # join, with an SSH key from their GitHub profile. To resume the job, exit the shell
      # or run "touch $GITHUB_WORKSPACE/continue".
      - name: Setup upterm session
        uses: owenthereal/action-upterm@v2
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        with:
          limit-access-to-actor: true

      # Build ITK-SNAP using CDash
      - name: ITK-SNAP Dashboard -- Configure and Build
        id: ctest-config
        working-directory: ${{github.workspace}}/itksnap/build
        shell: bash
        continue-on-error: true
        run: |
          ${{ matrix.ctest_cmd }} -VV -D ExperimentalStart
          # The update step only records the git revision for CDash. In pull requests its
          # "git fetch" fails (on the greedy submodule of the merge commit), which used to stop
          # this step before anything was configured or built.
          ${{ matrix.ctest_cmd }} -V -D ExperimentalUpdate || echo "ExperimentalUpdate failed; continuing"
          ${{ matrix.ctest_cmd }} -V -D ExperimentalConfigure
          ${{ matrix.ctest_cmd }} -V -D ExperimentalBuild
          # ExperimentalBuild exits with 0 even when there are compile errors, so check the
          # report it writes. Failing here (continue-on-error) still lets the tests and the
          # CDash submit run; the Gatekeeper then fails the job before caching and packaging.
          TAG=$(head -n 1 Testing/TAG)
          N_ERRORS=$(grep -c "<Error>" "Testing/$TAG/Build.xml" || true)
          if [ "$N_ERRORS" != "0" ]; then
            echo "::error::ITK-SNAP build had $N_ERRORS error(s)"
            exit 1
          fi

      - name: ITK-SNAP Dashboard -- Test
        id: ctest-test
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_testing }}
        working-directory: ${{github.workspace}}/itksnap/build
        shell: bash
        continue-on-error: true
        run: |
          # Print the output of failing tests, which CDash shows but the log otherwise doesn't
          ${{ matrix.ctest_cmd }} -D ExperimentalTest --output-on-failure

      - name: ITK-SNAP Dashboard -- Submit
        id: ctest-submit
        working-directory: ${{github.workspace}}/itksnap/build
        shell: bash
        continue-on-error: true
        run: |
          ${{ matrix.ctest_cmd }} -D ExperimentalSubmit

      # Fail the job if the configure or build failed, or the CDash submit failed. Failing
      # tests don't stop the job (some are allowed to fail); they are reported on CDash.
      - name: ITK-SNAP Dashboard -- Gatekeeper
        if: ${{ steps.ctest-config.outcome != 'success' || steps.ctest-submit.outcome != 'success' }}
        run: exit -1

      # Cache the ITK-SNAP build, for master only: each entry is about 400 MB, and saving one
      # for every branch and pull request filled the repository's 10 GB cache. Caches can't be
      # overwritten, so each run saves a new entry and then deletes the older ones.
      - name: Cache ITK-SNAP build directory
        if: ${{ github.ref == 'refs/heads/master' }}
        uses: actions/cache/save@v4
        with:
          path: ${{github.workspace}}/itksnap
          key: ${{ env.PLATFORM }}-itksnap-build-master-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Remove older ITK-SNAP build caches
        if: ${{ github.ref == 'refs/heads/master' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREFIX: ${{ env.PLATFORM }}-itksnap-build-master-
          KEEP: ${{ env.PLATFORM }}-itksnap-build-master-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/caches?key=$PREFIX&ref=refs/heads/master&per_page=100" \
              --jq '.actions_caches[].key' |
            while read -r key; do
              if [ "$key" != "$KEEP" ]; then
                echo "Deleting cache $key"
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches?key=$key&ref=refs/heads/master"
              fi
            done

      # Add libcurl.dll to PATH on windows
      - name: Append directory with libcurl.dll to PATH
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        run: |
          echo "${{github.workspace}}/vcpkg/installed/${{ matrix.vcpkg_triplet }}/bin" >> $GITHUB_PATH

      # On MacOS, setup keychain for application signing
      # The notarization keys are from https://appstoreconnect.apple.com/access/integrations/api
      - name: Setup codesign keychain
        if: ${{ runner.os == 'MacOS' && env.SKIP_PACKAGING != 'true' }}
        working-directory: ${{github.workspace}}/itksnap/build
        env:
          # Private key from the .p12 file (export certificate & key to .p12)
          CODESIGN_P12_KEY: ${{ secrets.SNAP_MACOSX_CODESIGN_P12_KEY }}
          # Unique substring of the certificate name (the number part is ok)
          CODESIGN_CERT: "${{ secrets.SNAP_MACOS_DEV_CERTIFICATE_NAME }}"
          # Notarization pkey/keyid/issuer triplet (pkey is base64 encoded)
          NOTARIZE_KEY: ${{ secrets.SNAP_MACOS_NOTARIZE_PRIVATE_KEY }}
          NOTARIZE_KEY_ID: ${{ secrets.SNAP_MACOS_NOTARIZE_KEY_ID }}
          NOTARIZE_ISSUER: ${{ secrets.SNAP_MACOS_NOTARIZE_ISSUER_UUID }}
        run: |
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import ../Utilities/MacOS/apple_developer_for_github.p12 -k build.keychain -P "$CODESIGN_P12_KEY" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          echo $NOTARIZE_KEY | base64 -d > notarize_key
          xcrun notarytool store-credentials -k notarize_key -d $NOTARIZE_KEY_ID -i $NOTARIZE_ISSUER --keychain /Users/runner/Library/Keychains/build.keychain-db itksnap_notarize
          rm -rf notarize_key
          cmake -DSNAP_MACOS_NOTARYTOOL_PROFILE=itksnap_notarize -DSNAP_MACOS_KEYCHAIN=/Users/runner/Library/Keychains/build.keychain-db -DSNAP_MACOSX_CODESIGN_CERT=$CODESIGN_CERT .

      # Package ITK-SNAP
      - name: Package ITK-SNAP
        if: ${{ env.SKIP_PACKAGING != 'true' }}
        continue-on-error: false
        working-directory: ${{github.workspace}}/itksnap/build
        shell: bash
        run: |
          cpack --verbose 

      # Extract the filename of ITK-SNAP package
      - name: Read package name
        id: package_itksnap
        if: ${{ env.SKIP_PACKAGING != 'true' }}
        working-directory: ${{github.workspace}}/itksnap/build
        shell: bash
        run: |
          echo "package_file=$(jq -r '.filename' package_info.json)" >> $GITHUB_OUTPUT

      - name: Upload artifact
        if: ${{ env.SKIP_PACKAGING != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{steps.package_itksnap.outputs.package_file}}
          path: ${{github.workspace}}/itksnap/build/${{steps.package_itksnap.outputs.package_file}}

      # The upload normally takes under a minute. The step timeout and the ssh keepalive
      # settings below keep a stalled connection from hanging the job until GitHub's 6-hour limit.
      - name: Upload to sourceforge
        if: ${{ env.SKIP_PACKAGING != 'true' }}
        timeout-minutes: 15
        working-directory: ${{github.workspace}}/itksnap/build
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.SNAP_SOURCEFORGE_PRIVATE_KEY }}
          PUBLIC_KEY: ${{ secrets.SNAP_SOURCEFORGE_PUBLIC_KEY }}
          USER: ${{ secrets.SNAP_SOURCEFORGE_PUBLIC_USERNAME }}
        run: |
          mkdir -p $HOME/.ssh && chmod 700 $HOME/.ssh
          echo $PUBLIC_KEY | base64 -d > $HOME/.ssh/sfkey.pub && chmod 600 $HOME/.ssh/sfkey.pub
          echo $PRIVATE_KEY | base64 -d > $HOME/.ssh/sfkey && chmod 600 $HOME/.ssh/sfkey
          touch $HOME/.ssh/config && chmod 600 $HOME/.ssh/config
          echo "StrictHostKeyChecking=no" >> $HOME/.ssh/config
          echo "BatchMode=yes" >> $HOME/.ssh/config
          echo "IdentityFile=~/.ssh/sfkey" >> $HOME/.ssh/config
          echo "ConnectTimeout=30" >> $HOME/.ssh/config
          echo "ServerAliveInterval=15" >> $HOME/.ssh/config
          echo "ServerAliveCountMax=4" >> $HOME/.ssh/config
          cmake -DSCP_USERNAME=$USER .
          cmake --build . --target itksnap_upload_experimental

      - name: Upload named release to sourceforge
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_release && !inputs.skip_packaging }}
        timeout-minutes: 15
        working-directory: ${{github.workspace}}/itksnap/build
        shell: bash
        run: |
          cmake --build . --target itksnap_upload_release

      - name: Cleanup secrets
        if: ${{ always() }}
        shell: bash
        # No working-directory: the build directory doesn't exist when an early step failed
        run: |
          rm -rf $HOME/.ssh/sfkey.pub $HOME/.ssh/sfkey
          # The keychain only exists when packaging ran (not in pull requests)
          ${{ runner.os == 'MacOS' && 'security delete-keychain build.keychain || true' || 'echo na' }}
        
      

      


